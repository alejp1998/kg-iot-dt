# Local development testbed for the KG-IoT Digital Twin
# Overrides testbed.yaml paths/ports for running on any host:
#   docker compose -f testbed.yaml -f testbed.local.yaml up -d
services:
  typedb:
    ports:
      - "1729:1729"

  mosquitto:
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
